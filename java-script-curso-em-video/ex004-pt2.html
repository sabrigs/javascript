<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRL format</title>
    <style>
        body {
            background-color: lightgoldenrodyellow;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2em;
            width: 500px;
            margin-inline: auto;
            margin-top: 56px;
            border: 1px dashed lightpink;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
        const value = Number(window.prompt("Write a number:"));
        document.write(`${value.toLocaleString("pt-BR", {style: "currency", currency: "BRL"})}`);
    </script>
</body>
</html>
