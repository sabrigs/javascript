<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Events</title>
    <style>
        body {
            background-color: lightgoldenrodyellow;
            font-family: Arial, Helvetica, sans-serif;
        }
        main {
            width: 500px;
            margin-inline: auto;
            margin-top: 56px;
            border: 1px dashed lightpink;
            border-radius: 16px;
            padding: 16px;
        }

        div.button {
            font-size: 1.5em;
            text-align: center;
            background-color: lightpink;
            font-weight: bolder;
            padding: 8px;
            height: 100px;
            line-height: 100px;
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <main>
        <h1>I'm a file test!</h1>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Explicabo, consequatur a? Amet tempore deserunt quidem eum nulla magnam quo incidunt dolorum? Ad quae autem molestiae minus deleniti! Tempore, ipsa labore!</p>
        <div class="button" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
            Clique aqui!
        </div>
    </main>
    <script>
        // Identify elements
        const button = window.document.querySelector("div.button");

        // Functions
        function clicar() {
            button.innerText = "Foi clicado!";
            button.style.color = "white";
            button.style.background = "blue";
        }

        function entrar() {
            button.innerText = "Mouse entrou!";
        }

        function sair() {
            button.innerText = "Mouse saiu!";
            button.style.color = "black";
            button.style.background = "lightpink";
        } 
    </script>
</body>
</html>
