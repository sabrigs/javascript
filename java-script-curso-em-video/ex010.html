<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        p.inline {
            display: inline;
        }

        input#velocity {
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>Nacionalidade</h1>
    <p class="inline">Qual país você mora?</p>
    <input type="text" name="country" id="country" placeholder="País">
    <input type="button" value="Verificar" id="buttonVerify">
    <div id="result">

    </div>

    <script>
        const buttonVerify = window.document.querySelector("input#buttonVerify");
        buttonVerify.addEventListener("click", clicar)

        const result = window.document.querySelector("div#result");
        const country = window.document.querySelector("input#country");

        function clicar() {
            const pais = country.value;
            result.innerHTML = `<p>Você vive em ${pais}.</p>`;
            if (pais != "Brasil") {
                result.innerHTML += `<p>Você é <strong>estrangeiro</strong>.</p>`
            }
            result.innerHTML += `<p>Você é brasileiro.</p>`
        }
    </script>
</body>
</html>
