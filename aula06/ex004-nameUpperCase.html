<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document template</title>
    <style>
        body {
            background-color: lightgoldenrodyellow;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2em;
            width: 500px;
            margin-inline: auto;
            margin-top: 56px;
            border: 1px dashed lightpink;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
        const name = window.prompt("Whats is your name?");
        document.write(`Your name is <strong>${name}</strong>!</br>`)
        document.write(`Your name has ${name.length} characters.</br>`)
        document.write(`Uppercase: ${name.toUpperCase()} and Lowercase: ${name.toLowerCase()}`)
    </script>
</body>
</html>
