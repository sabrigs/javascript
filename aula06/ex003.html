<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document template</title>
    <style>
        body {
            background-color: lightgoldenrodyellow;
            font-family: Arial, Helvetica, sans-serif;
        }
        main {
            width: 500px;
            margin-inline: auto;
            margin-top: 56px;
            border: 1px dashed lightpink;
            border-radius: 16px;
            padding: 16px;
        }
    </style>
</head>
<body>
    <main>

    <script>
        const n1 = Number(window.prompt("Number 1: "));

        window.alert(`The sum of number 1 (${n1}) and number 2 (${n2}) is ${sum}.`);
