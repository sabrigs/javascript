<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum calculator</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgoldenrodyellow;
        }

        main {
            max-width: 500px;
            margin-inline: auto;
            border: 1px dashed blueviolet;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
        }

        input {
            width: 100%;
            font-size: 1.5em;
            border-radius: 8px;
            height: 48px;
            text-align: center;
            margin-block: 8px;
        }

        input:focus-visible {
            outline: 3px dashed blueviolet;
            outline-offset: 2px;
        }

        p.inline {
            display: inline;
            color: blueviolet;
            font-size: 2em;
        }

        input.submitButton {
            height: 54px;
            background-color: #8a2be2;
            color: white;
        }

        input.resetButton {
            height: 54px;
            background-color: #d1b1ee;
            color: black;
            margin-top: 0px;
        }

        div.result {
            width: 100%;
            height: 54px;
            background-color: lightgrey;
            border-radius: 8px;
            line-height: 54px;
            font-size: 1.5em;
        }

        section.actions {
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Sum values</h1>
        <input type="number" name="value1" value="0" class="value1">
        <p class="inline">+</p>
        <input type="number" name="value2" value="0" class="value2">
        <p class="inline">=</p>
        <div class="result">
            0
        </div>
        <section class="actions">
            <input type="button" value="Show result" class="submitButton">
            <input type="button" value="Reset" class="resetButton">
        </section>
    </main>
    <script>
        const buttonSumit = window.document.querySelector("input.submitButton");
        const buttonReset = window.document.querySelector("input.resetButton");
        buttonSumit.addEventListener("click", somar);
        buttonReset.addEventListener("click", reset);

        const value1 = window.document.querySelector("input.value1");
        const value2 = window.document.querySelector("input.value2");
        const result = window.document.querySelector("div.result");

        function somar() {
            const v1 = Number(value1.value);
            const v2 = Number(value2.value);

            const sum = v1 + v2;
            result.innerHTML = sum;
        }

        function reset() {
            result.innerHTML = 0;
            value1.value = 0;
            value2.value = 0;
        }
    </script>
</body>
</html>
